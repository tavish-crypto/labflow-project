databases:
  - name: labflow-db
    plan: free
    databaseName: labflow
    user: labflow_user

services:
  - type: web
    name: labflow-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: labflow-db
          property: connectionString
      - key: CLIENT_URL
        value: https://your-app.vercel.app
